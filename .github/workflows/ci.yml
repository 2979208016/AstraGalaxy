name: CI Build

# 只做编译校验：产物是 debug APK，不参与发布。
# 发布包在本地用 release.keystore 签，私钥与密码不进仓库。
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # compileSdk 37 对应 platforms;android-37.0（Android 17，带 minor SDK 的目录名）。
      # 不用 android-actions/setup-android：v3 会执行 `sdkmanager tools`，该包已被 Google 下线。
      - name: Install SDK platform
        run: |
          sudo chown -R "$USER" "$ANDROID_SDK_ROOT" || true
          SDKM=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Compile
        run: gradle :app:assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Xmx2048m -Dorg.gradle.parallel=false

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astragalaxy-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
